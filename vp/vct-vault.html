<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>VCT VAULT — Pack Opening</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Rajdhani:wght@500;600;700&display=swap');

:root{
  --bg: #000000;
  --bg-deep: #000000;
  --panel: #0c0c0d;
  --panel-2: #131315;
  --line: rgba(255,255,255,.12);
  --ink: #ffffff;
  --ink-dim: #8c8c90;
  --red: #ff4655;
  --red-dim: #7a2029;
  --bronze: #9c6b3e;   --bronze-glow:#c98b52;
  --silver: #aeb7c2;   --silver-glow:#e3e9ef;
  --gold: #f0b429;     --gold-glow:#ffd76a;
  --diamond: #5cc8ff;  --diamond-glow:#a4e4ff;
  --radiant: #f2e9c9;  --radiant-glow:#fff6d9;
}

*{box-sizing:border-box; margin:0; padding:0;}

body{
  background: radial-gradient(ellipse at 50% -15%, #151516 0%, transparent 55%), #000;
  color: var(--ink);
  font-family:'Rajdhani', sans-serif;
  min-height:100vh;
  overflow-x:hidden;
}

::selection{ background:var(--red); color:#fff; }

/* ---------- layout shell ---------- */
.app{ max-width:1180px; margin:0 auto; padding:0 24px 80px; }

/* ---------- top bar ---------- */
.topbar{
  display:flex; align-items:center; justify-content:space-between;
  padding:20px 0; border-bottom:1px solid var(--line); gap:24px; flex-wrap:wrap;
}
.brand{ display:flex; align-items:center; gap:10px; }
.brand-mark{
  width:28px; height:28px; background:var(--red);
  clip-path: polygon(0 0, 100% 0, 100% 70%, 70% 100%, 0 100%);
  display:flex; align-items:center; justify-content:center;
  font-family:'Bebas Neue'; color:#000; font-size:16px;
}
.brand-name{ font-family:'Bebas Neue'; letter-spacing:2px; font-size:22px; }
.brand-name span{ color:var(--red); }

.nav{ display:flex; gap:30px; }
.nav button{
  font-family:'Bebas Neue'; letter-spacing:1.5px; font-size:15px;
  background:none; border:none; border-bottom:3px solid transparent;
  color:var(--ink-dim); padding:6px 0; cursor:pointer; transition:.15s;
}
.nav button:hover{ color:var(--ink); }
.nav button.active{ color:var(--ink); border-bottom-color:var(--red); }

.wallet{
  display:flex; align-items:center; gap:10px; background:var(--panel-2);
  border:1px solid var(--line); padding:8px 16px;
}
.wallet svg{ width:18px; height:18px; color:var(--gold); }
.wallet-amt{ font-family:'Bebas Neue'; font-size:20px; letter-spacing:1px; color:var(--gold); }
.wallet-label{ font-size:10px; letter-spacing:2px; color:var(--ink-dim); text-transform:uppercase; }

/* ---------- headers ---------- */
.page-head{ margin:36px 0 22px; }
.eyebrow{ font-size:12px; letter-spacing:4px; color:var(--red); text-transform:uppercase; font-weight:700; }
.page-title{ font-family:'Bebas Neue'; font-size:42px; letter-spacing:2px; margin-top:4px; }
.page-sub{ color:var(--ink-dim); font-size:15px; max-width:640px; margin-top:6px; font-weight:600;}

/* ---------- packs page ---------- */
.pack-grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(300px,1fr)); gap:26px; margin-top:10px; }

.pack{
  position:relative; background:var(--panel);
  border:1px solid var(--line);
  padding:26px; overflow:hidden; cursor:pointer;
  transition:transform .2s ease, border-color .2s;
}
.pack:hover{ transform:translateY(-4px); border-color:var(--red); }
.pack-tour{ font-size:12px; letter-spacing:3px; color:var(--ink-dim); text-transform:uppercase; font-weight:700;}
.pack-name{ font-family:'Bebas Neue'; font-size:30px; letter-spacing:1px; margin:6px 0 14px; color:var(--ink);}
.pack-art{
  height:150px; margin-bottom:16px; position:relative;
  background: var(--panel-2);
  display:flex; align-items:center; justify-content:center;
  border:1px solid var(--line);
}
.pack-art .glow{
  position:absolute; inset:0; opacity:.35; filter:blur(20px);
  background: radial-gradient(circle at 50% 50%, var(--accent) 0%, transparent 65%);
}
.pack-art svg{ width:64px; height:64px; position:relative; color:var(--accent); }
.pack-desc{ font-size:13.5px; color:var(--ink-dim); font-weight:600; line-height:1.5; margin-bottom:18px; min-height:40px;}
.pack-foot{ display:flex; align-items:center; justify-content:space-between; }
.pack-price{ font-family:'Bebas Neue'; font-size:22px; color:var(--gold); letter-spacing:1px;}
.pack-price span{ font-size:11px; color:var(--ink-dim); font-family:'Rajdhani'; letter-spacing:1px; text-transform:uppercase; margin-left:6px;}
.btn{
  font-family:'Bebas Neue'; letter-spacing:2px; font-size:15px;
  background:var(--red); color:#000; border:none; padding:10px 24px; cursor:pointer;
  transition:filter .15s, transform .15s;
}
.btn:hover{ filter:brightness(1.15); transform:translateY(-1px); }
.btn:disabled{ background:#2c2c2e; color:#6c6c70; cursor:not-allowed; }
.btn.ghost{ background:transparent; border:1px solid var(--line); color:var(--ink); }
.btn.ghost:hover{ border-color:var(--red); }

.odds-note{ margin-top:30px; font-size:12px; color:var(--ink-dim); border-top:1px solid var(--line); padding-top:16px; display:flex; gap:22px; flex-wrap:wrap;}
.odds-note b{ color:var(--ink); }
.odds-chip{ display:flex; align-items:center; gap:6px; }
.odds-dot{ width:9px; height:9px; border-radius:50%; }

/* ---------- filter bar ---------- */
.filterbar{ display:flex; gap:8px; flex-wrap:wrap; margin-bottom:22px; }
.chip{
  font-size:12.5px; font-weight:700; letter-spacing:1px; text-transform:uppercase;
  padding:7px 16px; border:1px solid var(--line); color:var(--ink-dim); background:var(--panel);
  cursor:pointer;
}
.chip.active{ background:var(--red); color:#000; border-color:var(--red); }

/* ---------- card component ---------- */
.card-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(158px,1fr)); gap:16px; }

@keyframes borderFlow{ 0%{background-position:0% 50%;} 100%{background-position:300% 50%;} }

.pcard{
  position:relative; aspect-ratio:3/4.2;
  clip-path: polygon(0 0, calc(100% - 14px) 0, 100% 14px, 100% 100%, 14px 100%, 0 calc(100% - 14px));
  padding:2.5px; background:var(--line);
  background-size:250% 250%; animation:borderFlow 7s linear infinite;
}
.pcard.locked{ opacity:.42; filter:grayscale(1); animation:none; }

.pcard-inner{
  position:relative; width:100%; height:100%; background:var(--panel-2);
  clip-path: polygon(0 0, calc(100% - 12px) 0, 100% 12px, 100% 100%, 12px 100%, 0 calc(100% - 12px));
  padding:12px 10px 10px; display:flex; flex-direction:column; overflow:hidden;
}

.pcard .tiertag{
  position:absolute; top:0; right:0; font-size:9.5px; letter-spacing:1.5px; font-weight:700;
  padding:3px 8px 3px 12px; text-transform:uppercase; color:#000; z-index:2;
  clip-path: polygon(14px 0,100% 0,100% 100%,0 100%);
}
.vault-owned{
  position:absolute; top:8px; left:0; font-size:8.5px; letter-spacing:1px; font-weight:700;
  padding:2px 8px 2px 6px; text-transform:uppercase; color:var(--ink); background:rgba(0,0,0,.55);
  border-left:2px solid var(--gold); z-index:2;
}
.pcard[data-tier="bronze"] .tiertag{ background:var(--bronze); }
.pcard[data-tier="silver"] .tiertag{ background:var(--silver); }
.pcard[data-tier="gold"]   .tiertag{ background:var(--gold); }
.pcard[data-tier="diamond"] .tiertag{ background:var(--diamond); }
.pcard[data-tier="radiant"] .tiertag{ background:linear-gradient(90deg,#fff,#f2e9c9,#ffd76a); }

.pcard-inner .rtg{ font-family:'Bebas Neue'; font-size:32px; line-height:1; margin-top:14px;}
.pcard-inner .role-row{ display:flex; align-items:center; gap:6px; margin:4px 0 6px; color:var(--ink-dim);}
.pcard-inner .role-row svg{ width:14px; height:14px; }
.pcard-inner .role-row span{ font-size:10.5px; letter-spacing:1px; text-transform:uppercase; font-weight:700;}
.stat-row{ display:flex; gap:5px; margin-bottom:6px; }
.stat-box{ flex:1; background:rgba(255,255,255,.04); border:1px solid var(--line); text-align:center; padding:3px 0; }
.stat-box .stat-k{ display:block; font-size:8px; letter-spacing:1px; color:var(--ink-dim); font-weight:700; }
.stat-box .stat-v{ display:block; font-family:'Bebas Neue'; font-size:14px; line-height:1.1; }
.pcard-inner .avatar{
  flex:1; display:flex; align-items:center; justify-content:center; margin:0 0 6px; min-height:0;
  background:radial-gradient(circle, rgba(255,255,255,.05), transparent 70%); position:relative; overflow:hidden;
}
.pcard-inner .avatar img{ width:100%; height:100%; object-fit:cover; }
.pcard-inner .avatar .avatar-fallback{ display:none; align-items:center; justify-content:center; width:100%; height:100%; }
.pcard-inner .avatar svg{ width:38px; height:38px; opacity:.8; }
.pcard-inner .pname{ font-family:'Bebas Neue'; font-size:16px; letter-spacing:.5px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.pcard-inner .pteam{ font-size:10px; color:var(--ink-dim); font-weight:700; letter-spacing:1px; text-transform:uppercase; display:flex; justify-content:space-between; align-items:center; margin-top:2px;}
.pcard-inner .count-badge{
  background:var(--red); color:#fff; font-size:10px; font-weight:700; padding:1px 6px;
  clip-path: polygon(4px 0,100% 0,100% 100%,0 100%);
}
.pcard-inner .locked-q{ font-family:'Bebas Neue'; font-size:40px; text-align:center; margin:auto; color:var(--ink-dim);}

/* ---------- inventory ---------- */
.inv-row{
  display:flex; align-items:center; gap:16px; background:var(--panel); border:1px solid var(--line);
  padding:12px 16px; margin-bottom:10px;
  clip-path: polygon(0 0, calc(100% - 14px) 0, 100% 14px, 100% 100%, 14px 100%, 0 calc(100% - 14px));
}
.inv-tier-bar{ width:5px; align-self:stretch; }
.inv-tier-bar[data-tier="bronze"]{ background:var(--bronze);}
.inv-tier-bar[data-tier="silver"]{ background:var(--silver);}
.inv-tier-bar[data-tier="gold"]{ background:var(--gold);}
.inv-tier-bar[data-tier="diamond"]{ background:var(--diamond);}
.inv-tier-bar[data-tier="radiant"]{ background:linear-gradient(180deg,#fff,#ffd76a);}
.inv-icon{ width:34px; height:34px; flex-shrink:0; opacity:.85; }
.inv-info{ flex:1; min-width:0; }
.inv-name{ font-family:'Bebas Neue'; font-size:19px; letter-spacing:.5px; }
.inv-meta{ font-size:12px; color:var(--ink-dim); font-weight:700; letter-spacing:.5px; text-transform:uppercase;}
.inv-rtg{ font-family:'Bebas Neue'; font-size:24px; width:56px; text-align:center; flex-shrink:0;}
.inv-qty{ font-size:13px; color:var(--ink-dim); font-weight:700; width:54px; text-align:center; flex-shrink:0;}
.inv-sell-btn{
  font-family:'Bebas Neue'; letter-spacing:1px; font-size:14px; background:var(--panel-2); border:1px solid var(--gold);
  color:var(--gold); padding:8px 16px; cursor:pointer; flex-shrink:0;
}
.inv-sell-btn:hover{ background:var(--gold); color:#000; }
.empty-state{
  text-align:center; padding:70px 20px; color:var(--ink-dim); border:1px dashed var(--line);
}
.empty-state .big{ font-family:'Bebas Neue'; font-size:26px; color:var(--ink); margin-bottom:8px; letter-spacing:1px;}

.csv-gate{ max-width:520px; margin:80px auto; text-align:center; }
.csv-gate .page-sub{ margin:0 auto; }

/* ---------- toast ---------- */
#toast{
  position:fixed; bottom:26px; left:50%; transform:translateX(-50%) translateY(20px);
  background:var(--panel); border:1px solid var(--gold); color:var(--ink);
  padding:12px 22px; font-weight:700; font-size:14px; letter-spacing:.5px; z-index:500;
  opacity:0; pointer-events:none; transition:.25s;
}
#toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }

/* ---------- opening overlay ---------- */
#overlay{
  position:fixed; inset:0; background:rgba(4,7,9,.94); backdrop-filter:blur(6px);
  z-index:1000; display:none; align-items:center; justify-content:center; flex-direction:column;
}
#overlay.show{ display:flex; }
.overlay-close{
  position:absolute; top:22px; right:26px; background:none; border:none; color:var(--ink-dim);
  font-family:'Bebas Neue'; font-size:15px; letter-spacing:2px; cursor:pointer;
}
.overlay-close:hover{ color:var(--red); }

.pack-stage{ display:flex; flex-direction:column; align-items:center; gap:26px; }
.tour-tag{ font-family:'Bebas Neue'; letter-spacing:4px; color:var(--ink-dim); font-size:15px; }

.sleeve{
  width:210px; height:290px; position:relative;
  background:linear-gradient(155deg, var(--panel-2) 0%, var(--bg-deep) 100%);
  border:2px solid var(--red);
  clip-path: polygon(0 8%, 100% 0, 100% 92%, 0 100%);
  display:flex; align-items:center; justify-content:center;
  transition:transform .15s;
}
.sleeve::before{
  content:''; position:absolute; inset:0;
  background: repeating-linear-gradient(115deg, rgba(255,70,85,.08) 0 3px, transparent 3px 30px);
}
.sleeve-mark{ font-family:'Bebas Neue'; font-size:22px; letter-spacing:3px; color:var(--red); text-align:center; z-index:2;}
.sleeve-sub{ font-size:11px; color:var(--ink-dim); letter-spacing:2px; margin-top:6px; text-align:center; z-index:2;}
.sleeve.shaking{ animation:shake .45s ease; }
.sleeve.burst{ animation:burstOut .35s ease forwards; }
@keyframes shake{
  0%,100%{ transform:translateX(0) rotate(0); }
  15%{ transform:translateX(-8px) rotate(-2deg); }
  30%{ transform:translateX(8px) rotate(2deg); }
  45%{ transform:translateX(-10px) rotate(-3deg); }
  60%{ transform:translateX(10px) rotate(3deg); }
  75%{ transform:translateX(-6px) rotate(-1deg); }
  90%{ transform:translateX(6px) rotate(1deg); }
}
@keyframes burstOut{ to{ transform:scale(1.3); opacity:0; } }

.tap-hint{ font-size:12px; color:var(--ink-dim); letter-spacing:1px; animation:pulse 1.6s infinite; }
@keyframes pulse{ 0%,100%{opacity:.5;} 50%{opacity:1;} }

.flash{
  position:fixed; inset:0; background:#fff; opacity:0; z-index:1001; pointer-events:none;
}
.flash.go{ animation:flashAnim .4s ease; }
@keyframes flashAnim{ 0%{opacity:0;} 12%{opacity:1;} 100%{opacity:0;} }

.reveal-row{ display:flex; gap:22px; flex-wrap:wrap; justify-content:center; }
.reveal-card{ width:172px; height:246px; position:relative; opacity:0; transform:scale(.75); }
.reveal-card.shown{ animation:cardPopIn .45s cubic-bezier(.2,.8,.2,1) forwards; }
@keyframes cardPopIn{
  0%{ opacity:0; transform:scale(.75); }
  60%{ opacity:1; transform:scale(1.05); }
  100%{ opacity:1; transform:scale(1); }
}
.pcard-full-frame{
  width:100%; height:100%; padding:2.5px;
  clip-path: polygon(0 0, calc(100% - 14px) 0, 100% 14px, 100% 100%, 14px 100%, 0 calc(100% - 14px));
  background-size:250% 250%; animation:borderFlow 7s linear infinite;
}
.pcard-full{
  width:100%; height:100%; padding:14px 12px 12px; display:flex; flex-direction:column;
  clip-path: polygon(0 0, calc(100% - 12px) 0, 100% 12px, 100% 100%, 12px 100%, 0 calc(100% - 12px));
  background:var(--panel-2); position:relative; overflow:hidden;
}
.pcard-full::after{
  content:''; position:absolute; inset:0; background:radial-gradient(circle at 50% 30%, var(--tier-color) 0%, transparent 70%);
  opacity:0; animation: cardGlow .8s ease .1s;
}
@keyframes cardGlow{ 0%{opacity:.6;} 100%{opacity:0;} }
.pcard-full .ptag{ font-size:10px; font-weight:700; letter-spacing:1.5px; text-transform:uppercase; color:var(--tier-color); }
.pcard-full .prtg{ font-family:'Bebas Neue'; font-size:38px; line-height:1; margin-top:4px; }
.pcard-full .prole{ display:flex; align-items:center; gap:6px; color:var(--ink-dim); margin:4px 0 8px;}
.pcard-full .prole svg{ width:15px; height:15px; }
.pcard-full .prole span{ font-size:10.5px; letter-spacing:1px; text-transform:uppercase; font-weight:700;}
.pcard-full .pavatar{ flex:1; display:flex; align-items:center; justify-content:center; min-height:0; position:relative; overflow:hidden; }
.pcard-full .pavatar img{ width:100%; height:100%; object-fit:cover; }
.pcard-full .pavatar .avatar-fallback{ display:none; align-items:center; justify-content:center; width:100%; height:100%; }
.pcard-full .pavatar svg{ width:46px; height:46px; opacity:.85; }
.pcard-full .pname{ font-family:'Bebas Neue'; font-size:19px; }
.pcard-full .pteamline{ font-size:10.5px; color:var(--ink-dim); font-weight:700; text-transform:uppercase; letter-spacing:1px; }
.dupe-badge{
  position:absolute; top:8px; right:8px; background:var(--red); color:#fff; font-size:10px; font-weight:700;
  padding:2px 7px; clip-path: polygon(4px 0,100% 0,100% 100%,0 100%); z-index:2;
}

.reveal-footer{ margin-top:30px; display:flex; flex-direction:column; align-items:center; gap:14px; }
.reveal-summary{ font-size:13px; color:var(--ink-dim); font-weight:600; }

@media (max-width:600px){
  .page-title{ font-size:32px; }
  .topbar{ flex-direction:column; align-items:stretch; }
  .nav{ justify-content:center; }
}
</style>
</head>
<body>

<div class="app">
  <div class="topbar">
    <div class="brand">
      <div class="brand-mark">V</div>
      <div class="brand-name">VCT <span>VAULT</span></div>
    </div>
    <div class="nav" id="nav">
      <button data-page="packs" class="active">PACKS</button>
      <button data-page="vault">VAULT</button>
      <button data-page="collection">MY COLLECTION</button>
      <button data-page="inventory">INVENTORY</button>
    </div>
    <div class="wallet">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 7h18M3 7v10a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V7M3 7l2-4h14l2 4M8 12h.01M16 12h.01"/></svg>
      <div>
        <div class="wallet-amt" id="creditsDisplay">0</div>
        <div class="wallet-label">Credits</div>
      </div>
    </div>
  </div>

  <div id="pageContent">
    <div class="csv-gate">
      <div class="eyebrow">Loading</div>
      <div class="page-title">FETCHING PLAYER DATA…</div>
    </div>
  </div>
</div>

<div id="toast"></div>

<div class="flash" id="flash"></div>

<div id="overlay">
  <button class="overlay-close" id="overlayClose">✕ CLOSE</button>
  <div class="pack-stage" id="packStage"></div>
</div>

<script>
/* =========================================================
   DATA
   ========================================================= */
let CARDS = [];
let dataReady = false;

// Tier is derived from roleRTG, not stored in the CSV.
function tierFromRtg(r){
  if(r>=90) return 'radiant';
  if(r>=80) return 'diamond';
  if(r>=70) return 'gold';
  if(r>=60) return 'silver';
  return 'bronze';
}

// Card id is built from its own fields (not row position) so IDs stay stable
// across CSV re-orders/edits - important since owned/discovered cards are
// referenced by id in saved progress.
function rowToCard(r){
  const player = String(r.Player || '').trim();
  const team = String(r.Team || '').trim();
  const tournament = String(r.Tournament || '').trim();
  const role = String(r.Role || '').trim();
  const rtg = Number(r.roleRTG);
  return {
    id: `${tournament}|${team}|${player}|${role}`.toLowerCase().replace(/\s+/g,'_'),
    player, team, tournament, role,
    att: Number(r.attRTG),
    def: Number(r.defRTG),
    rtg,
    tier: tierFromRtg(rtg)
  };
}

function rowsToCards(rows){
  return rows
    .filter(r => r.Player && r.Tournament && r.roleRTG !== undefined && r.roleRTG !== '')
    .map(rowToCard);
}

const TIERS = {
  bronze:  { label:"Bronze",  color:"#9c6b3e", glow:"#c98b52", weight:0.42,
             grad:"linear-gradient(120deg, #6e4423, #c98b52, #6e4423, #c98b52)" },
  silver:  { label:"Silver",  color:"#aeb7c2", glow:"#e3e9ef", weight:0.32,
             grad:"linear-gradient(120deg, #7c8791, #e3e9ef, #7c8791, #e3e9ef)" },
  gold:    { label:"Gold",    color:"#f0b429", glow:"#ffd76a", weight:0.16,
             grad:"linear-gradient(120deg, #b9791a, #ffd76a, #b9791a, #ffd76a)" },
  diamond: { label:"Diamond", color:"#5cc8ff", glow:"#a4e4ff", weight:0.075,
             grad:"linear-gradient(120deg, #2f8fc4, #a4e4ff, #2f8fc4, #a4e4ff)" },
  radiant: { label:"Radiant", color:"#f2e9c9", glow:"#fff6d9", weight:0.025,
             grad:"linear-gradient(120deg, #ffd76a, #ffffff, #f2e9c9, #ffffff, #ffd76a)" }
};
const TIER_ORDER = ["bronze","silver","gold","diamond","radiant"];

let RTG_MIN = 56, RTG_MAX = 96; // sane defaults, recalculated once CSV loads
function computeRtgRange(){
  RTG_MIN = Math.min(...CARDS.map(c=>c.rtg));
  RTG_MAX = Math.max(...CARDS.map(c=>c.rtg));
}

function sellPrice(rtg){
  const mult = 1 + ((rtg - RTG_MIN) / (RTG_MAX - RTG_MIN)) * 4; // 1x -> 5x
  return Math.round((150 * mult) / 5) * 5;
}

const PACKS = [
  {
    id:"stage1", tournament:"Stage 1", name:"STAGE 1 PACK", price:150, count:1,
    desc:"Early-season form. One card pulled from every roster that fought through the opening stage."
  },
  {
    id:"masters", tournament:"MASTERS LONDON", name:"MASTERS LONDON PACK", price:200, count:1,
    desc:"The international stage. One card pulled from the higher-stakes Masters London field."
  }
];

const STARTING_CREDITS = 5000;
const STORAGE_KEY = "vct_vault_state_v1";

/* =========================================================
   ICONS
   ========================================================= */
const ICONS = {
  Duelist: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6.5 17.5 17.5 6.5M14 4l6 6M4 14l6 6M9 15l-4.5 4.5M15 9l4.5-4.5"/></svg>`,
  Initiator: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="2"/><circle cx="12" cy="12" r="6" stroke-dasharray="3 3"/><circle cx="12" cy="12" r="10" stroke-dasharray="1 4"/></svg>`,
  Controller: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 18c2-1 3-3 3-5s-1-3-1-5 2-4 5-4 5 2 5 4-1 3-1 5 1 4 3 5"/><path d="M2 19c3 1.5 6 2 10 2s7-.5 10-2"/></svg>`,
  Sentinel: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 3l7 3v6c0 4.5-3 8-7 9-4-1-7-4.5-7-9V6z"/></svg>`
};
const AVATAR_SVG = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="8" r="3.4"/><path d="M4.5 20c1.2-4 4-6 7.5-6s6.3 2 7.5 6"/></svg>`;
const BOX_SVG = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M21 8l-9-5-9 5 9 5 9-5zM3 8v8l9 5 9-5V8M12 13v8"/></svg>`;
const COIN_SVG = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M12 7v10M9 9.5c0-1.5 1.3-2 3-2s3 .8 3 2-1.3 1.7-3 2-3 .7-3 2 1.3 2 3 2 3-.5 3-2"/></svg>`;

function roleIcon(role){ return ICONS[role] || ICONS.Sentinel; }

// Headshot PNGs are optional — drop files into a `headshots/` folder next to this
// HTML file, named by slugified player name (e.g. "TenZ" -> headshots/tenz.png).
// If a player-specific file isn't found, this falls back to a single shared
// silhouette image (headshots/silhouette.png), and if even that's missing,
// falls back to the built-in placeholder icon.
const SILHOUETTE_SRC = "headshots/silhouette.png";

function headshotSlug(player){
  return player.toLowerCase().replace(/[^a-z0-9]/g,'');
}
function avatarBlock(player){
  const src = `headshots/${headshotSlug(player)}.png`;
  return `<img src="${src}" alt="${player}" loading="lazy"
      onerror="this.onerror=function(){ this.style.display='none'; this.nextElementSibling.style.display='flex'; }; this.src='${SILHOUETTE_SRC}';">
    <span class="avatar-fallback">${AVATAR_SVG}</span>`;
}

/* =========================================================
   STATE (persisted via localStorage — this page is meant to be self-hosted,
   e.g. on GitHub Pages, so we use standard browser storage, not the
   Claude.ai-artifact-only window.storage API)
   ========================================================= */
let state = { credits: STARTING_CREDITS, owned: [], discovered: [] };
let currentPage = "packs";
let uidCounter = 1;

function loadState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw){
      state = JSON.parse(raw);
      uidCounter = (state.owned.reduce((m,o)=>Math.max(m, o.uid||0), 0)) + 1;
    }
  }catch(e){
    // no saved state yet, or storage unavailable (e.g. private browsing) — use defaults
  }
  render();
}

function saveState(){
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  }catch(e){
    console.error("Could not save progress", e);
  }
}

/* =========================================================
   HELPERS
   ========================================================= */
function cardById(id){ return CARDS.find(c=>c.id===id); }

function weightedTierPick(pool){
  // filter tiers that actually have cards in this pool
  const available = TIER_ORDER.filter(t => pool.some(c=>c.tier===t));
  const totalW = available.reduce((s,t)=>s+TIERS[t].weight,0);
  let r = Math.random()*totalW;
  for(const t of available){
    r -= TIERS[t].weight;
    if(r<=0) return t;
  }
  return available[available.length-1];
}

function pullCard(tournament){
  const pool = CARDS.filter(c=>c.tournament===tournament);
  const tier = weightedTierPick(pool);
  const tierPool = pool.filter(c=>c.tier===tier);
  return tierPool[Math.floor(Math.random()*tierPool.length)];
}

function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toast._h);
  toast._h = setTimeout(()=>t.classList.remove('show'), 2200);
}

function ownedCountFor(cardId){
  return state.owned.filter(o=>o.cardId===cardId).length;
}

/* =========================================================
   RENDER: SHELL
   ========================================================= */
function render(){
  document.getElementById('creditsDisplay').textContent = state.credits.toLocaleString();
  document.querySelectorAll('#nav button').forEach(b=>{
    b.classList.toggle('active', b.dataset.page===currentPage);
  });
  const root = document.getElementById('pageContent');
  if(currentPage==='packs') root.innerHTML = renderPacks();
  if(currentPage==='vault') root.innerHTML = renderVault();
  if(currentPage==='collection') root.innerHTML = renderCollection();
  if(currentPage==='inventory') root.innerHTML = renderInventory();
  attachPageHandlers();
}

document.getElementById('nav').addEventListener('click', (e)=>{
  if(!dataReady) return;
  const btn = e.target.closest('button[data-page]');
  if(!btn) return;
  currentPage = btn.dataset.page;
  collectionFilter = {tournament:'all', tier:'all'};
  vaultFilter = {tournament:'all', tier:'all'};
  render();
});

/* =========================================================
   RENDER: PACKS PAGE
   ========================================================= */
function renderPacks(){
  const packCards = PACKS.map(p=>{
    const accent = p.id==='masters' ? 'var(--diamond)' : 'var(--red)';
    return `
    <div class="pack" data-pack="${p.id}" style="--accent:${accent}">
      <div class="pack-tour">${p.tournament}</div>
      <div class="pack-name">${p.name}</div>
      <div class="pack-art">
        <div class="glow"></div>
        ${BOX_SVG}
      </div>
      <div class="pack-desc">${p.desc}</div>
      <div class="pack-foot">
        <div class="pack-price">${p.price.toLocaleString()}<span>credits · ${p.count} card${p.count>1?'s':''}</span></div>
        <button class="btn open-btn" data-pack="${p.id}" ${state.credits<p.price?'disabled':''}>OPEN</button>
      </div>
    </div>`;
  }).join('');

  const oddsChips = TIER_ORDER.map(t=>`
    <div class="odds-chip"><span class="odds-dot" style="background:${TIERS[t].color}"></span><b>${TIERS[t].label}</b>&nbsp;${(TIERS[t].weight*100).toFixed(1)}%</div>
  `).join('');

  return `
    <div class="page-head">
      <div class="eyebrow">Pull Roster Cards</div>
      <div class="page-title">OPEN A PACK</div>
      <div class="page-sub">Spend credits to pull player cards from each tournament's field. Higher roleRTG cards are rarer — and worth more if you decide to sell them.</div>
    </div>
    <div class="pack-grid">${packCards}</div>
    <div class="odds-note">
      ${oddsChips}
    </div>
  `;
}

/* =========================================================
   RENDER: VAULT PAGE (browse every card, no packing required)
   ========================================================= */
let vaultFilter = { tournament:'all', tier:'all' };

function renderVault(){
  const tournaments = ['all', ...new Set(CARDS.map(c=>c.tournament))];
  const tourChips = tournaments.map(t=>`
    <button class="chip ${vaultFilter.tournament===t?'active':''}" data-vtour="${t}">${t==='all'?'All Events':t}</button>
  `).join('');
  const tierChips = ['all', ...TIER_ORDER].map(t=>`
    <button class="chip ${vaultFilter.tier===t?'active':''}" data-vtier="${t}">${t==='all'?'All Rarities':TIERS[t].label}</button>
  `).join('');

  let list = CARDS.filter(c=>
    (vaultFilter.tournament==='all' || c.tournament===vaultFilter.tournament) &&
    (vaultFilter.tier==='all' || c.tier===vaultFilter.tier)
  );
  list = [...list].sort((a,b)=> b.rtg - a.rtg);

  const cards = list.map(c=>{
    const isDiscovered = state.discovered.includes(c.id);
    return `
      <div class="pcard" data-tier="${c.tier}" style="background:${TIERS[c.tier].grad}">
        <div class="tiertag">${TIERS[c.tier].label}</div>
        ${isDiscovered ? '<div class="vault-owned">IN COLLECTION</div>' : ''}
        <div class="pcard-inner">
          <div class="rtg" style="color:${TIERS[c.tier].color}">${c.rtg}</div>
          <div class="role-row">${roleIcon(c.role)}<span>${c.role}</span></div>
          <div class="stat-row">
            <div class="stat-box"><span class="stat-k">ATT</span><span class="stat-v">${c.att}</span></div>
            <div class="stat-box"><span class="stat-k">DEF</span><span class="stat-v">${c.def}</span></div>
          </div>
          <div class="avatar">${avatarBlock(c.player)}</div>
          <div class="pname">${c.player}</div>
          <div class="pteam"><span>${c.team}</span><span>${c.tournament}</span></div>
        </div>
      </div>`;
  }).join('');

  return `
    <div class="page-head">
      <div class="eyebrow">Full Card Database</div>
      <div class="page-title">THE VAULT</div>
      <div class="page-sub">Every card from every tournament, fully revealed — browse the entire set without spending credits on packs.</div>
    </div>
    <div class="filterbar">${tourChips}</div>
    <div class="filterbar">${tierChips}</div>
    <div class="card-grid">${cards || `<div class="empty-state" style="grid-column:1/-1"><div class="big">No cards match this filter</div>Try a different rarity or event.</div>`}</div>
  `;
}

/* =========================================================
   RENDER: COLLECTION PAGE
   ========================================================= */
let collectionFilter = { tournament:'all', tier:'all' };

function renderCollection(){
  const tournaments = ['all', ...new Set(CARDS.map(c=>c.tournament))];
  const tourChips = tournaments.map(t=>`
    <button class="chip ${collectionFilter.tournament===t?'active':''}" data-ctour="${t}">${t==='all'?'All Events':t}</button>
  `).join('');
  const tierChips = ['all', ...TIER_ORDER].map(t=>`
    <button class="chip ${collectionFilter.tier===t?'active':''}" data-ctier="${t}">${t==='all'?'All Rarities':TIERS[t].label}</button>
  `).join('');

  let list = CARDS.filter(c=>
    (collectionFilter.tournament==='all' || c.tournament===collectionFilter.tournament) &&
    (collectionFilter.tier==='all' || c.tier===collectionFilter.tier)
  );

  const discoveredCount = CARDS.filter(c=>state.discovered.includes(c.id)).length;

  const cards = list.map(c=>{
    const isDiscovered = state.discovered.includes(c.id);
    const qty = ownedCountFor(c.id);
    if(!isDiscovered){
      return `
      <div class="pcard locked" data-tier="${c.tier}" style="background:${TIERS[c.tier].grad}">
        <div class="tiertag">${TIERS[c.tier].label}</div>
        <div class="pcard-inner">
          <div class="locked-q">?</div>
          <div class="pname" style="text-align:center;">LOCKED</div>
          <div class="pteam" style="justify-content:center;">${c.tournament}</div>
        </div>
      </div>`;
    }
    return `
      <div class="pcard" data-tier="${c.tier}" style="background:${TIERS[c.tier].grad}">
        <div class="tiertag">${TIERS[c.tier].label}</div>
        <div class="pcard-inner">
          <div class="rtg" style="color:${TIERS[c.tier].color}">${c.rtg}</div>
          <div class="role-row">${roleIcon(c.role)}<span>${c.role}</span></div>
          <div class="stat-row">
            <div class="stat-box"><span class="stat-k">ATT</span><span class="stat-v">${c.att}</span></div>
            <div class="stat-box"><span class="stat-k">DEF</span><span class="stat-v">${c.def}</span></div>
          </div>
          <div class="avatar">${avatarBlock(c.player)}</div>
          <div class="pname">${c.player}</div>
          <div class="pteam"><span>${c.team}</span>${qty>0?`<span class="count-badge">×${qty}</span>`:'<span style="opacity:.5">0 held</span>'}</div>
        </div>
      </div>`;
  }).join('');

  return `
    <div class="page-head">
      <div class="eyebrow">Collection Book</div>
      <div class="page-title">YOUR ROSTER</div>
      <div class="page-sub">${discoveredCount} / ${CARDS.length} cards discovered across both tournaments. Cards stay in your collection book even after you sell them.</div>
    </div>
    <div class="filterbar">${tourChips}</div>
    <div class="filterbar">${tierChips}</div>
    <div class="card-grid">${cards || `<div class="empty-state" style="grid-column:1/-1"><div class="big">No cards match this filter</div>Try a different rarity or event.</div>`}</div>
  `;
}

/* =========================================================
   RENDER: INVENTORY PAGE
   ========================================================= */
function renderInventory(){
  const groups = {};
  state.owned.forEach(o=>{
    groups[o.cardId] = groups[o.cardId] || [];
    groups[o.cardId].push(o);
  });
  const cardIds = Object.keys(groups);

  if(cardIds.length===0){
    return `
      <div class="page-head">
        <div class="eyebrow">Sell Cards</div>
        <div class="page-title">INVENTORY</div>
        <div class="page-sub">Cards you currently hold. Sell any card for credits — value scales with roleRTG.</div>
      </div>
      <div class="empty-state"><div class="big">Your inventory is empty</div>Open a pack to start pulling cards.</div>
    `;
  }

  cardIds.sort((a,b)=> cardById(b).rtg - cardById(a).rtg);

  const rows = cardIds.map(id=>{
    const c = cardById(id);
    const qty = groups[id].length;
    const price = sellPrice(c.rtg);
    return `
      <div class="inv-row">
        <div class="inv-tier-bar" data-tier="${c.tier}"></div>
        <div class="inv-icon" style="color:${TIERS[c.tier].color}">${roleIcon(c.role)}</div>
        <div class="inv-info">
          <div class="inv-name">${c.player}</div>
          <div class="inv-meta">${c.team} · ${c.tournament} · ${TIERS[c.tier].label} · ATT ${c.att} / DEF ${c.def}</div>
        </div>
        <div class="inv-rtg" style="color:${TIERS[c.tier].color}">${c.rtg}</div>
        <div class="inv-qty">×${qty} held</div>
        <button class="inv-sell-btn" data-sell="${id}">SELL · ${price}</button>
      </div>
    `;
  }).join('');

  const totalValue = state.owned.reduce((sum,o)=> sum + sellPrice(cardById(o.cardId).rtg), 0);

  return `
    <div class="page-head">
      <div class="eyebrow">Sell Cards</div>
      <div class="page-title">INVENTORY</div>
      <div class="page-sub">${state.owned.length} cards held · est. sell value ${totalValue.toLocaleString()} credits. Base price is 150 credits, multiplied up to 5× by roleRTG.</div>
    </div>
    ${rows}
  `;
}

/* =========================================================
   PAGE HANDLERS
   ========================================================= */
function attachPageHandlers(){
  document.querySelectorAll('.open-btn').forEach(btn=>{
    btn.addEventListener('click', ()=> startPackOpening(btn.dataset.pack));
  });
  document.querySelectorAll('[data-ctour]').forEach(btn=>{
    btn.addEventListener('click', ()=>{ collectionFilter.tournament = btn.dataset.ctour; render(); });
  });
  document.querySelectorAll('[data-ctier]').forEach(btn=>{
    btn.addEventListener('click', ()=>{ collectionFilter.tier = btn.dataset.ctier; render(); });
  });
  document.querySelectorAll('[data-vtour]').forEach(btn=>{
    btn.addEventListener('click', ()=>{ vaultFilter.tournament = btn.dataset.vtour; render(); });
  });
  document.querySelectorAll('[data-vtier]').forEach(btn=>{
    btn.addEventListener('click', ()=>{ vaultFilter.tier = btn.dataset.vtier; render(); });
  });
  document.querySelectorAll('[data-sell]').forEach(btn=>{
    btn.addEventListener('click', ()=> sellOne(btn.dataset.sell));
  });
}

function sellOne(cardId){
  const idx = state.owned.findIndex(o=>o.cardId===cardId);
  if(idx===-1) return;
  const c = cardById(cardId);
  const price = sellPrice(c.rtg);
  state.owned.splice(idx,1);
  state.credits += price;
  saveState();
  toast(`Sold ${c.player} for ${price.toLocaleString()} credits`);
  render();
}

/* =========================================================
   PACK OPENING SEQUENCE
   ========================================================= */
let pendingPulls = [];
let activePack = null;

function startPackOpening(packId){
  const pack = PACKS.find(p=>p.id===packId);
  if(!pack || state.credits < pack.price) return;

  activePack = pack;
  state.credits -= pack.price;
  saveState();
  render();

  pendingPulls = [];
  for(let i=0;i<pack.count;i++) pendingPulls.push(pullCard(pack.tournament));

  const overlay = document.getElementById('overlay');
  overlay.classList.add('show');
  showSleeveStage();
}

function showSleeveStage(){
  const stage = document.getElementById('packStage');
  stage.innerHTML = `
    <div class="tour-tag">${activePack.tournament}</div>
    <div class="sleeve" id="sleeve">
      <div>
        <div class="sleeve-mark">VCT<br>VAULT</div>
        <div class="sleeve-sub">${activePack.name}</div>
      </div>
    </div>
    <div class="tap-hint">OPENING…</div>
  `;
  setTimeout(openSleeve, 700);
}

function openSleeve(){
  const sleeve = document.getElementById('sleeve');
  sleeve.classList.add('shaking');
  setTimeout(()=>{
    sleeve.classList.remove('shaking');
    sleeve.classList.add('burst');
    document.getElementById('flash').classList.add('go');
    setTimeout(showRevealStage, 260);
    setTimeout(()=> document.getElementById('flash').classList.remove('go'), 400);
  }, 450);
}

function showRevealStage(){
  // commit pulls to state now
  pendingPulls.forEach(card=>{
    if(!state.discovered.includes(card.id)) state.discovered.push(card.id);
    state.owned.push({ uid: uidCounter++, cardId: card.id });
  });
  saveState();

  const stage = document.getElementById('packStage');
  const cardsHtml = pendingPulls.map((c,i)=>{
    return `
    <div class="reveal-card" data-idx="${i}">
      <div class="pcard-full-frame" style="background:${TIERS[c.tier].grad}">
        <div class="pcard-full" style="--tier-color:${TIERS[c.tier].color}">
          <div class="ptag">${TIERS[c.tier].label}</div>
          <div class="prtg">${c.rtg}</div>
          <div class="prole">${roleIcon(c.role)}<span>${c.role}</span></div>
          <div class="stat-row">
            <div class="stat-box"><span class="stat-k">ATT</span><span class="stat-v">${c.att}</span></div>
            <div class="stat-box"><span class="stat-k">DEF</span><span class="stat-v">${c.def}</span></div>
          </div>
          <div class="pavatar">${avatarBlock(c.player)}</div>
          <div class="pname">${c.player}</div>
          <div class="pteamline">${c.team} · ${c.tournament}</div>
        </div>
      </div>
    </div>`;
  }).join('');

  stage.innerHTML = `
    <div class="tour-tag">${activePack.name}</div>
    <div class="reveal-row">${cardsHtml}</div>
    <div class="reveal-footer">
      <div class="reveal-summary" id="revealSummary">${pendingPulls.length} card${pendingPulls.length>1?'s':''} added to your collection</div>
      <button class="btn ghost" id="collectBtn">CONTINUE</button>
    </div>
  `;

  // reveal happens right in the burst/flash beat - pop cards in immediately, no separate step
  document.querySelectorAll('.reveal-card').forEach(el=> el.classList.add('shown'));
  document.getElementById('collectBtn').addEventListener('click', closeOverlay);
}

function closeOverlay(){
  document.getElementById('overlay').classList.remove('show');
  render();
}

/* =========================================================
   INIT — load player data from CSV, then start the app
   ========================================================= */
const CSV_FILENAME = "VCT_PlayerRatings.csv";

async function initApp(){
  try{
    const res = await fetch(CSV_FILENAME, { cache: "no-store" });
    if(!res.ok) throw new Error(`fetch returned ${res.status}`);
    const text = await res.text();
    const parsed = Papa.parse(text, { header:true, skipEmptyLines:true });
    const parsedCards = rowsToCards(parsed.data);
    if(parsedCards.length === 0) throw new Error("CSV parsed but contained no valid rows");
    CARDS = parsedCards;
    startApp();
  }catch(e){
    showCsvError(e.message);
  }
}

function showCsvError(detail){
  document.getElementById('pageContent').innerHTML = `
    <div class="csv-gate">
      <div class="eyebrow">Load Player Data</div>
      <div class="page-title">COULDN'T LOAD CSV</div>
      <div class="page-sub">
        Couldn't automatically load <b>${CSV_FILENAME}</b> from this folder${detail ? ` (${detail})` : ''}.
        Make sure the file is named exactly <b>${CSV_FILENAME}</b>, sits in the same folder as this page,
        and has been pushed to your host. This only works when the page is served over http(s)
        (e.g. GitHub Pages) — opened directly from disk via file://, browsers block the request.
      </div>
      <button class="btn" style="margin-top:18px;" id="retryBtn">RETRY</button>
    </div>
  `;
  document.getElementById('retryBtn').addEventListener('click', initApp);
}

function startApp(){
  dataReady = true;
  computeRtgRange();
  loadState();
}

// Safety net: if something unexpected throws before the app finishes booting,
// don't leave the person staring at "FETCHING PLAYER DATA…" forever - surface
// a message so it's obvious something needs attention (check the browser
// console for the actual error).
window.addEventListener('error', (e)=>{
  if(!dataReady){
    showCsvError(e.message || 'see browser console for details');
  }
});

try{
  document.getElementById('overlayClose')?.addEventListener('click', closeOverlay);
  initApp();
}catch(e){
  showCsvError(e.message || 'see browser console for details');
}
</script>
