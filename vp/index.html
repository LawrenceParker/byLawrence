<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Valorant Championship Cards</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="app">
  <div class="topbar">
    <div class="brand">
      <div class="brand-mark">VCC</div>
      <div class="brand-name">VALORANT CHAMPIONSHIP <span>CARDS</span></div>
    </div>
    <div class="nav" id="nav">
      <button data-page="vault">VAULT</button>
    </div>
  </div>
</div>

  <div id="pageContent">
    <div class="csv-gate">
      <div class="eyebrow">Loading</div>
      <div class="page-title">FETCHING PLAYER DATA…</div>
    </div>
  </div>
</div>

<div id="toast"></div>

<div class="flash" id="flash"></div>

<div id="overlay">
  <button class="overlay-close" id="overlayClose">✕ CLOSE</button>
  <div class="pack-stage" id="packStage"></div>
</div>

<script src="script.js"></script>
</body>
<footer>Ratings calculated using stats from VLR.GG</footer>
</html>
